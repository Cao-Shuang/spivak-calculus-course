<svg xmlns="http://www.w3.org/2000/svg" width="744" height="430" viewBox="0 0 744 430" role="img" aria-labelledby="title"><title id="title">枚举正有理数与 Cantor 对角线：覆盖网格和逃出列表</title><rect width="744" height="430" rx="16" fill="#edf4f5"/><g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#203747"><rect x="12" y="12" width="348" height="404" rx="12" fill="#f8fbfc"/><rect x="384" y="12" width="348" height="404" rx="12" fill="#f8fbfc"/><text x="28" y="40" font-size="16" fill="#203747" text-anchor="start">枚举：每个分数最终被访问</text><text x="402" y="40" font-size="16" fill="#203747" text-anchor="start">对角线：第 n 位排除第 n 行</text><polyline points="54,87 114,87 54,141 54,195 114,141 174,87 234,87 174,141 114,195 54,249 54,303 114,249 174,195 234,141 294,87" fill="none" stroke="#ce632b" stroke-width="2.4"/><rect x="38" y="74" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="54" y="91" font-size="14" fill="#087f8c" text-anchor="middle">1/1</text><rect x="98" y="74" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="114" y="91" font-size="14" fill="#087f8c" text-anchor="middle">1/2</text><rect x="158" y="74" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="174" y="91" font-size="14" fill="#087f8c" text-anchor="middle">1/3</text><rect x="218" y="74" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="234" y="91" font-size="14" fill="#087f8c" text-anchor="middle">1/4</text><rect x="278" y="74" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="294" y="91" font-size="14" fill="#087f8c" text-anchor="middle">1/5</text><rect x="38" y="128" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="54" y="145" font-size="14" fill="#087f8c" text-anchor="middle">2/1</text><rect x="98" y="128" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="114" y="145" font-size="14" fill="#087f8c" text-anchor="middle">2/2</text><rect x="158" y="128" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="174" y="145" font-size="14" fill="#087f8c" text-anchor="middle">2/3</text><rect x="218" y="128" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="234" y="145" font-size="14" fill="#087f8c" text-anchor="middle">2/4</text><rect x="278" y="128" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="294" y="145" font-size="14" fill="#087f8c" text-anchor="middle">2/5</text><rect x="38" y="182" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="54" y="199" font-size="14" fill="#087f8c" text-anchor="middle">3/1</text><rect x="98" y="182" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="114" y="199" font-size="14" fill="#087f8c" text-anchor="middle">3/2</text><rect x="158" y="182" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="174" y="199" font-size="14" fill="#087f8c" text-anchor="middle">3/3</text><rect x="218" y="182" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="234" y="199" font-size="14" fill="#087f8c" text-anchor="middle">3/4</text><rect x="278" y="182" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="294" y="199" font-size="14" fill="#087f8c" text-anchor="middle">3/5</text><rect x="38" y="236" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="54" y="253" font-size="14" fill="#087f8c" text-anchor="middle">4/1</text><rect x="98" y="236" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="114" y="253" font-size="14" fill="#087f8c" text-anchor="middle">4/2</text><rect x="158" y="236" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="174" y="253" font-size="14" fill="#087f8c" text-anchor="middle">4/3</text><rect x="218" y="236" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="234" y="253" font-size="14" fill="#087f8c" text-anchor="middle">4/4</text><rect x="278" y="236" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="294" y="253" font-size="14" fill="#087f8c" text-anchor="middle">4/5</text><rect x="38" y="290" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="54" y="307" font-size="14" fill="#087f8c" text-anchor="middle">5/1</text><rect x="98" y="290" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="114" y="307" font-size="14" fill="#087f8c" text-anchor="middle">5/2</text><rect x="158" y="290" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="174" y="307" font-size="14" fill="#087f8c" text-anchor="middle">5/3</text><rect x="218" y="290" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="234" y="307" font-size="14" fill="#087f8c" text-anchor="middle">5/4</text><rect x="278" y="290" width="32" height="24" rx="4" fill="#f8fbfc"/><text x="294" y="307" font-size="14" fill="#087f8c" text-anchor="middle">5/5</text><text x="28" y="355" font-size="13" fill="#203747" text-anchor="start">按 m+n 分层；每层只有有限项</text><text x="28" y="381" font-size="13" fill="#203747" text-anchor="start">重复数值跳过，不会漏掉新分数</text><text x="402" y="88" font-size="14" fill="#203747" text-anchor="start">x1</text><rect x="437" y="66" width="34" height="32" rx="5" fill="#f8ddc7"/><text x="454" y="87" font-size="20" fill="#ce632b" text-anchor="middle">5</text><text x="516" y="87" font-size="20" fill="#203747" text-anchor="middle">1</text><text x="578" y="87" font-size="20" fill="#203747" text-anchor="middle">4</text><text x="640" y="87" font-size="20" fill="#203747" text-anchor="middle">2</text><text x="402" y="142" font-size="14" fill="#203747" text-anchor="start">x2</text><text x="454" y="141" font-size="20" fill="#203747" text-anchor="middle">2</text><rect x="499" y="120" width="34" height="32" rx="5" fill="#f8ddc7"/><text x="516" y="141" font-size="20" fill="#ce632b" text-anchor="middle">3</text><text x="578" y="141" font-size="20" fill="#203747" text-anchor="middle">7</text><text x="640" y="141" font-size="20" fill="#203747" text-anchor="middle">5</text><text x="402" y="196" font-size="14" fill="#203747" text-anchor="start">x3</text><text x="454" y="195" font-size="20" fill="#203747" text-anchor="middle">9</text><text x="516" y="195" font-size="20" fill="#203747" text-anchor="middle">0</text><rect x="561" y="174" width="34" height="32" rx="5" fill="#f8ddc7"/><text x="578" y="195" font-size="20" fill="#ce632b" text-anchor="middle">5</text><text x="640" y="195" font-size="20" fill="#203747" text-anchor="middle">1</text><text x="402" y="250" font-size="14" fill="#203747" text-anchor="start">x4</text><text x="454" y="249" font-size="20" fill="#203747" text-anchor="middle">1</text><text x="516" y="249" font-size="20" fill="#203747" text-anchor="middle">5</text><text x="578" y="249" font-size="20" fill="#203747" text-anchor="middle">8</text><rect x="623" y="228" width="34" height="32" rx="5" fill="#f8ddc7"/><text x="640" y="249" font-size="20" fill="#ce632b" text-anchor="middle">8</text><text x="402" y="317" font-size="20" fill="#087f8c" text-anchor="start">y = 0. 6   5   6   5 …</text><text x="402" y="355" font-size="13" fill="#203747" text-anchor="start">对角位不是 5 就写 5，否则写 6</text><text x="402" y="381" font-size="13" fill="#203747" text-anchor="start">只用 5、6，避免 0.999… 的歧义</text></g></svg>