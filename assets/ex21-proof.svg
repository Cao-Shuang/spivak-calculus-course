<svg xmlns="http://www.w3.org/2000/svg" width="744" height="450" viewBox="0 0 744 450" role="img" aria-labelledby="title"><title id="title">e 超越性证明的构造逻辑：一阶零点差异、素数整除与小误差</title><rect width="744" height="450" rx="16" fill="#edf4f5"/><g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#203747"><text x="25" y="40" font-size="18" fill="#203747" text-anchor="start">同一个辅助多项式，完成两种不同的整数任务</text><rect x="20" y="60" width="342" height="245" rx="12" fill="#f8fbfc"/><rect x="382" y="60" width="342" height="245" rx="12" fill="#f8fbfc"/><text x="36" y="94" font-size="14" fill="#087f8c" text-anchor="start">在原点：零点阶数 p−1</text><text x="36" y="128" font-size="14" fill="#203747" text-anchor="start">最低项积分 → (p−1)!/(p−1)!</text><text x="36" y="162" font-size="14" fill="#203747" text-anchor="start">保留常数 (−1)ⁿᵖ(n!)ᵖ</text><text x="36" y="196" font-size="14" fill="#203747" text-anchor="start">其余项都有阶乘因子 p</text><text x="36" y="230" font-size="14" fill="#203747" text-anchor="start">选择素数 p&gt;n</text><text x="36" y="264" font-size="14" fill="#087f8c" text-anchor="start">结论：M 是整数，且 p 不整除 M</text><text x="398" y="94" font-size="14" fill="#087f8c" text-anchor="start">在 k=1,…,n：零点阶数 p</text><text x="398" y="128" font-size="14" fill="#203747" text-anchor="start">平移 u=x−k 后都含 uᵖ</text><text x="398" y="162" font-size="14" fill="#203747" text-anchor="start">所有单项式积分 → r!/(p−1)!</text><text x="398" y="196" font-size="14" fill="#203747" text-anchor="start">每一项都含因子 p</text><text x="398" y="230" font-size="14" fill="#087f8c" text-anchor="start">结论：Mₖ 是整数，且 p 整除 Mₖ</text><text x="25" y="343" font-size="16" fill="#203747" text-anchor="start">再令 p&gt;|a₀|：N=a₀M+a₁M₁+⋯+aₙMₙ 是非零整数</text><text x="25" y="379" font-size="16" fill="#203747" text-anchor="start">固定 n 后增大 p：总误差 |E| ≤ B·Cᵖ/(p−1)! → 0</text><text x="25" y="420" font-size="16" fill="#ce632b" text-anchor="start">假设的代数方程却要求 N+E=0，于是 1 ≤ |N|=|E| &lt; 1，矛盾</text></g></svg>