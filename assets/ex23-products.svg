<svg xmlns="http://www.w3.org/2000/svg" width="744" height="450" viewBox="0 0 744 450" role="img" aria-labelledby="t"><title id="t">乘积表的方块尾部与逐条对角线枚举</title><rect width="744" height="450" rx="16" fill="#edf4f5"/><g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="35" font-size="18" fill="#203747">先圈住有限核心，再统一控制外部所有项</text><rect x="28" y="60" width="54" height="54" rx="5" fill="#b7e4e2"/><text x="36" y="91" font-size="12" fill="#203747">a1b1</text><rect x="86" y="60" width="54" height="54" rx="5" fill="#b7e4e2"/><text x="94" y="91" font-size="12" fill="#203747">a1b2</text><rect x="144" y="60" width="54" height="54" rx="5" fill="#b7e4e2"/><text x="152" y="91" font-size="12" fill="#203747">a1b3</text><rect x="202" y="60" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="210" y="91" font-size="12" fill="#203747">a1b4</text><rect x="260" y="60" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="268" y="91" font-size="12" fill="#203747">a1b5</text><rect x="28" y="118" width="54" height="54" rx="5" fill="#b7e4e2"/><text x="36" y="149" font-size="12" fill="#203747">a2b1</text><rect x="86" y="118" width="54" height="54" rx="5" fill="#b7e4e2"/><text x="94" y="149" font-size="12" fill="#203747">a2b2</text><rect x="144" y="118" width="54" height="54" rx="5" fill="#b7e4e2"/><text x="152" y="149" font-size="12" fill="#203747">a2b3</text><rect x="202" y="118" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="210" y="149" font-size="12" fill="#203747">a2b4</text><rect x="260" y="118" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="268" y="149" font-size="12" fill="#203747">a2b5</text><rect x="28" y="176" width="54" height="54" rx="5" fill="#b7e4e2"/><text x="36" y="207" font-size="12" fill="#203747">a3b1</text><rect x="86" y="176" width="54" height="54" rx="5" fill="#b7e4e2"/><text x="94" y="207" font-size="12" fill="#203747">a3b2</text><rect x="144" y="176" width="54" height="54" rx="5" fill="#b7e4e2"/><text x="152" y="207" font-size="12" fill="#203747">a3b3</text><rect x="202" y="176" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="210" y="207" font-size="12" fill="#203747">a3b4</text><rect x="260" y="176" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="268" y="207" font-size="12" fill="#203747">a3b5</text><rect x="28" y="234" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="36" y="265" font-size="12" fill="#203747">a4b1</text><rect x="86" y="234" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="94" y="265" font-size="12" fill="#203747">a4b2</text><rect x="144" y="234" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="152" y="265" font-size="12" fill="#203747">a4b3</text><rect x="202" y="234" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="210" y="265" font-size="12" fill="#203747">a4b4</text><rect x="260" y="234" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="268" y="265" font-size="12" fill="#203747">a4b5</text><rect x="28" y="292" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="36" y="323" font-size="12" fill="#203747">a5b1</text><rect x="86" y="292" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="94" y="323" font-size="12" fill="#203747">a5b2</text><rect x="144" y="292" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="152" y="323" font-size="12" fill="#203747">a5b3</text><rect x="202" y="292" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="210" y="323" font-size="12" fill="#203747">a5b4</text><rect x="260" y="292" width="54" height="54" rx="5" fill="#f8ddc7"/><text x="268" y="323" font-size="12" fill="#203747">a5b5</text><text x="359" y="92" font-size="17" fill="#087f8c">方块内：i,j ≤ L</text><text x="359" y="130" font-size="14" fill="#203747">任意枚举最终都会收齐这有限批项</text><text x="359" y="185" font-size="17" fill="#ce632b">方块外：i&gt;L 或 j&gt;L</text><text x="359" y="223" font-size="14" fill="#203747">全部绝对值总量 = AB − AᴸBᴸ</text><text x="359" y="255" font-size="14" fill="#203747">L 增大时趋零，顺序因此不再重要</text><text x="24" y="391" font-size="16" fill="#203747">按 i+j 分层并合并一整条对角线，就得到 Cauchy 乘积</text><text x="24" y="424" font-size="14" fill="#203747">条件收敛时缺少这条绝对尾量控制；题 10 的对角线和甚至不趋零</text></g></svg>